<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>試写室</title>
<style>
:root{--bg:#0f0d0e;--panel:#1a1718;--panel2:#242021;--line:#3a3334;--fg:#f3ecea;--dim:#a99c99;--red:#d8262f;--ok:#3fb27f;--ng:#8a7f80;--ngs:#c62828;--fix:#e8a33a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 88%,transparent);padding-top:calc(env(safe-area-inset-top) + 12px);padding-bottom:8px}
.marquee{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;border-bottom:3px solid var(--red);padding-bottom:8px}
h1{font-size:24px;margin:0;line-height:1.15}
h1 small{display:block;font-size:11px;color:var(--dim);letter-spacing:.1em;font-weight:500}
.tally{display:flex;gap:14px;font-variant-numeric:tabular-nums}
.tally div{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.tally b{font-size:20px}
.tally span{font-size:11px;color:var(--dim)}
.bar2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red)}
.who{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.who input{width:9em;font:inherit;font-size:16px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
section.ep{padding:16px 0 4px}
.ep h2{font-size:15px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.ep h2 .cnt{font-size:12px;color:var(--dim);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;min-width:0}
.poster{position:relative;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:var(--panel2)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.pill{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#111}
.pill.ok{background:var(--ok)}.pill.ng{background:var(--ng);color:#fff}
.pill2{position:absolute;right:6px;bottom:6px;font-size:11px;padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.75)}
.card.isng .poster img{opacity:.35;filter:grayscale(1)}
.card .t{font-size:13px;font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.card .memo{font-size:11px;color:var(--fix);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--dim);text-align:center;padding:40px 0}
/* 再生画面 */
.proj{position:fixed;inset:0;z-index:20;background:rgba(8,6,7,.97);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 52px) max(12px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 92px) max(12px,env(safe-area-inset-left))}
.proj[hidden]{display:none}
.projtop{position:fixed;left:0;right:0;top:0;z-index:22;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:rgba(8,6,7,.97)}
.projtop .pos{flex:1;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--dim)}
.auto{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;color:var(--dim)}
.auto input{width:18px;height:18px;accent-color:var(--red);margin:0}
.stage{display:grid;grid-template-columns:auto minmax(0,400px);gap:20px;align-items:start;justify-content:center;max-width:1000px;margin:0 auto}
.screen{height:min(calc(100svh - 160px - env(safe-area-inset-top) - env(safe-area-inset-bottom)),860px);aspect-ratio:9/16;max-width:100%;margin:0 auto;background:#000;border-radius:10px;overflow:hidden}
.screen iframe{width:100%;height:100%;border:0;display:block}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.ttl{font-size:17px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.yt{font-size:13px;color:var(--dim)}
.cur{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.cur[hidden]{display:none}
.cur span{flex:1;font-weight:700}
.cur .reset{min-height:44px;padding:6px 14px;font-size:15px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.prev{border-left:4px solid var(--fix)}
.prev h3{margin:0 0 4px;font-size:13px;color:var(--fix)}
.prev p{margin:0;white-space:pre-wrap;font-size:14px;line-height:1.6}
.box label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
textarea{display:block;width:100%;min-height:110px;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:16px;line-height:1.6;padding:10px}
.save{display:block;width:100%;margin-top:8px;min-height:48px;font:inherit;font-size:16px;font-weight:700;border:0;border-radius:10px;background:var(--fix);color:#111;cursor:pointer}
.save:disabled{background:var(--panel2);color:var(--dim)}
.meta{font-size:12px;color:var(--dim);margin-top:6px;min-height:18px}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:22;display:grid;grid-template-columns:56px 1fr 1fr 56px;gap:8px;padding:8px max(10px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 8px) max(10px,env(safe-area-inset-left));background:rgba(15,13,14,.97);border-top:1px solid var(--line);max-width:640px;margin:0 auto}
.btn{appearance:none;border:2px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:13px;padding:6px 10px;border-radius:10px;cursor:pointer;touch-action:manipulation}
.actbar .btn{min-height:58px;font-size:20px;font-weight:800}
.actbar .btn:active{transform:scale(.96)}
.actbar .ok{border-color:var(--ok);color:var(--ok)}.actbar .ng{border-color:var(--ngs);color:#ef7b7b}
.actbar .ok[aria-pressed=true]{background:var(--ok);color:#111}
.actbar .ng[aria-pressed=true]{background:var(--ngs);border-color:var(--ngs);color:#fff}
.proj.typing .actbar,.proj.typing .projtop{display:none}
.proj.typing{padding-top:calc(env(safe-area-inset-top) + 12px);padding-bottom:40vh}
#stamp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:30;opacity:0}
#stamp span{font-size:min(36vw,200px);font-weight:900;line-height:1;padding:.1em .22em;border:.06em solid currentColor;border-radius:.16em;background:var(--panel)}
#stamp.on{animation:st .9s ease-out both}
@keyframes st{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--fg);color:#111;padding:8px 16px;border-radius:999px;font-size:14px;z-index:31;display:none;max-width:90vw;text-align:center}
#toast.err{background:var(--ngs);color:#fff}
#toast.on{display:block}
@media (max-width:760px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .card .t{font-size:12px}
  .who{margin-left:0;width:100%}
  .who input{flex:1}
}
@media (prefers-reduced-motion:reduce){#stamp.on{animation:none;opacity:0}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="marquee">
    <h1><small>コヤッキーチャンネル【開運バラエティ】切り抜き</small>試写室</h1>
    <div class="tally" id="tally"></div>
  </div>
  <div class="bar2">
    <div id="filters" role="group" aria-label="絞り込み" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <label class="who">名前<input id="name" maxlength="40" autocomplete="name" placeholder="任意"></label>
  </div>
</div></header>
<main class="wrap" id="shelves"><p class="empty">読み込み中…</p></main>

<div class="proj" id="proj" hidden role="dialog" aria-modal="true" aria-label="試写">
  <div class="projtop">
    <label class="auto"><input type="checkbox" id="autonext" checked>押したら次へ</label>
    <span class="pos" id="pos"></span>
    <button class="btn" id="close" type="button">閉じる ✕</button>
  </div>
  <div class="stage">
    <div class="screen" id="screen"></div>
    <div class="side">
      <div class="ttl" id="ttl"></div>
      <div class="cur" id="cur" hidden><span id="curtxt"></span><button class="btn reset" id="reset" type="button">判定を取り消す</button></div>
      <a class="yt" id="ytlink" target="_blank" rel="noopener">YouTubeで開く ↗</a>
      <div class="box prev" id="prevbox" hidden><h3>前回の修正指示</h3><p id="prevtxt"></p></div>
      <div class="box">
        <label for="memo">直してほしい所・コメント（OKでも書けます）</label>
        <textarea id="memo" placeholder="例：冒頭3秒カット／上のテロップを「〜」に"></textarea>
        <button class="save" id="save" type="button" disabled>コメントを送る</button>
        <div class="meta" id="meta"></div>
      </div>
    </div>
  </div>
  <div class="actbar">
    <button class="btn" id="prev" type="button" aria-label="前の動画">←</button>
    <button class="btn ok" data-s="ok" type="button">OK</button>
    <button class="btn ng" data-s="ng" type="button">ボツ</button>
    <button class="btn" id="next" type="button" aria-label="次の動画">→</button>
  </div>
</div>
<div id="stamp" aria-hidden="true"><span></span></div>
<div id="toast" role="status"></div>

<script>
const API='https://firestore.googleapis.com/v1/projects/koyakki-shisha/databases/(default)/documents/reviews';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL={ok:'OK',ng:'ボツ'};
const FILTERS=[['all','すべて'],['none','未チェック'],['ok','OK'],['ng','ボツ']];
let items=[],reviews={},filter='all',list=[],current=-1,nextT;
const st=k=>(reviews[k]&&reviews[k].status)||'';
const ep=i=>{const m=i.title.match(/^[①-⑳]?\s*(\S+?回)/);return m?m[1]:'その他'};

try{$('name').value=localStorage.getItem('shisha_name')||''}catch(e){}
$('name').addEventListener('change',()=>{try{localStorage.setItem('shisha_name',$('name').value)}catch(e){}});
try{const a=localStorage.getItem('shisha_autonext');if(a!==null)$('autonext').checked=a==='1'}catch(e){}
$('autonext').addEventListener('change',()=>{try{localStorage.setItem('shisha_autonext',$('autonext').checked?'1':'0')}catch(e){}});

let toastT;
function toast(msg,err){const t=$('toast');t.textContent=msg;t.className='on'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',1800)}
function stamp(s){const el=$('stamp'),sp=el.firstChild;sp.textContent=LABEL[s];sp.style.color=s==='ok'?'var(--ok)':'#ef7b7b';el.classList.remove('on');void el.offsetWidth;el.classList.add('on')}

function visible(i){const s=st(i.key);if(filter==='all')return true;if(filter==='none')return!s;return s===filter}
function renderTally(){
  const n=k=>items.filter(i=>st(i.key)===k).length;
  $('tally').innerHTML=[[items.length,'全部'],[items.length-n('ok')-n('ng'),'未チェック'],[n('ok'),'OK'],[n('ng'),'ボツ']].map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');
  $('filters').innerHTML=FILTERS.map(([k,l])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join('');
}
function renderShelves(){
  const groups={},order=[];
  for(const i of items){if(!visible(i))continue;const g=ep(i);if(!groups[g]){groups[g]=[];order.push(g)}groups[g].push(i)}
  const shown=order.flatMap(g=>groups[g]);
  if(current<0)list=shown;
  if(!shown.length){$('shelves').innerHTML='<p class="empty">この条件の動画はありません。</p>';return}
  $('shelves').innerHTML=order.map(g=>`<section class="ep"><h2>${esc(g)}<span class="cnt">${groups[g].length}本</span></h2><div class="grid">${groups[g].map(i=>{
    const s=st(i.key),note=reviews[i.key]&&reviews[i.key].note,y=esc(i.youtube);
    const pill=s?`<span class="pill ${s}">${LABEL[s]}</span>`:'';
    const fx=i.badge?`<span class="pill2">${esc(i.badge)}</span>`:(i.prev?'<span class="pill2">修正版</span>':'');
    return `<button class="card${s==='ng'?' isng':''}" type="button" data-k="${esc(i.key)}"><div class="poster"><img loading="lazy" src="https://i.ytimg.com/vi/${y}/oar2.jpg" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${y}/hqdefault.jpg'" alt="">${pill}${fx}</div><div class="t">${esc(i.title)}</div>${note?`<div class="memo">✎ ${esc(note)}</div>`:''}</button>`}).join('')}</div></section>`).join('');
}
function renderAll(){renderTally();renderShelves();if(current>=0)renderVerdict()}

function open(key){current=list.findIndex(i=>i.key===key);if(current<0)return;$('proj').hidden=false;document.body.style.overflow='hidden';show()}
function show(){
  const i=list[current];
  $('screen').innerHTML=`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(i.youtube)}?playsinline=1&rel=0&autoplay=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(i.title)}"></iframe>`;
  $('pos').textContent=`${current+1} / ${list.length}`;
  $('ttl').textContent=i.title;
  $('ytlink').href='https://youtube.com/shorts/'+encodeURIComponent(i.youtube);
  $('prevbox').hidden=!i.prev;$('prevtxt').textContent=i.prev||'';
  $('memo').value=(reviews[i.key]&&reviews[i.key].note)||'';
  $('proj').scrollTop=0;
  renderVerdict();
}
function renderVerdict(){
  const i=list[current];if(!i)return;const s=st(i.key),r=reviews[i.key]||{};
  document.querySelectorAll('.actbar [data-s]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===s)));
  $('cur').hidden=!s;$('curtxt').textContent=s?`いまの判定：${LABEL[s]}`:'';$('curtxt').style.color=s==='ok'?'var(--ok)':'#ef7b7b';
  $('save').disabled=$('memo').value===(r.note||'');
  $('meta').textContent=r.at?`最後の記録：${new Date(r.at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}${r.name?'（'+r.name+'）':''}`:'';
}
function close(){clearTimeout(nextT);$('proj').hidden=true;$('screen').innerHTML='';document.body.style.overflow='';current=-1;renderShelves()}
function step(d){if(!list.length)return;clearTimeout(nextT);current=(current+d+list.length)%list.length;show()}

async function save(item,patch){
  const prev=reviews[item.key]||{status:'',note:''};
  const rec={status:prev.status||'',note:prev.note||'',...patch,name:$('name').value.trim(),title:item.title,at:new Date().toISOString()};
  const fields={};Object.keys(rec).forEach(k=>fields[k]={stringValue:rec[k]});
  reviews[item.key]=rec;renderAll();
  try{
    const r=await fetch(API+'/'+encodeURIComponent(item.key),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});
    if(!r.ok)throw new Error(r.status);
    return true;
  }catch(e){reviews[item.key]=prev;renderAll();toast('保存できませんでした。もう一度押してください',true);return false}
}
async function judge(s){
  if(current<0)return;const i=list[current];
  const patch={status:s};
  const memo=$('memo').value;if(memo!==((reviews[i.key]&&reviews[i.key].note)||''))patch.note=memo;   // 書きかけのコメントも一緒に保存
  if(!await save(i,patch))return;
  stamp(s);
  const auto=$('autonext').checked&&current<list.length-1;
  clearTimeout(nextT);if(auto)nextT=setTimeout(()=>step(1),900);
}
$('reset').onclick=async()=>{if(current<0)return;clearTimeout(nextT);const i=list[current];if(await save(i,{status:''}))toast('判定を取り消しました（未チェックに戻しました）')};
$('save').onclick=async()=>{if(current<0)return;const i=list[current];if(await save(i,{note:$('memo').value}))toast('コメントを保存しました')};
$('memo').addEventListener('input',()=>{const i=list[current];$('save').disabled=!i||$('memo').value===((reviews[i.key]&&reviews[i.key].note)||'')});
$('memo').addEventListener('focus',()=>$('proj').classList.add('typing'));
$('memo').addEventListener('blur',()=>$('proj').classList.remove('typing'));
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;renderAll();return}
  const c=e.target.closest('.card');if(c){open(c.dataset.k);return}
  const v=e.target.closest('.actbar [data-s]');if(v){judge(v.dataset.s);return}
});
$('close').onclick=close;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
document.addEventListener('keydown',e=>{if($('proj').hidden||e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;if(e.key==='Escape')close();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});

(async()=>{
  try{const r=await fetch('items.json?'+Date.now(),{cache:'no-store'});items=await r.json()}
  catch(e){$('shelves').innerHTML='<p class="empty">一覧を読み込めませんでした。開き直してください。</p>';return}
  try{
    let url=API+'?pageSize=300',docs=[];
    for(let n=0;n<10&&url;n++){const r=await fetch(url);const d=await r.json();docs=docs.concat(d.documents||[]);url=d.nextPageToken?API+'?pageSize=300&pageToken='+d.nextPageToken:''}
    for(const d of docs){const k=d.name.split('/').pop(),f=d.fields||{},o={};for(const a in f)o[a]=Object.values(f[a])[0];reviews[k]=o}
  }catch(e){toast('判定を読み込めませんでした',true)}
  renderAll();
})();
</script>
</body>
</html>
